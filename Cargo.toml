[package]
name = "ebbooks"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
axum-htmx = "0.8.1"
axum-test = "21.1.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["serde", "v3", "v4", "v7"] }
serde_json = "1.0.151"
test-log = "0.2.21"
reqwest = { version = "0.13.5", features = ["json"] }
bytes = "1.12.1"
tower-http = { version = "0.7.1", features = ["trace"] }
askama = { version = "0.16.1", features = ["serde_json"] }
log = "0.4.34"
redb = { version = "4.2.0", features = ["uuid"] }
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.20"
dotenvy = "0.15.7"
graphql_client = { version = "0.16.0", features = ["reqwest"] }
strsim = "0.11.1"
epub = "2.1.5"
image = "0.25.10"
tempfile = "3.27.0"
url = "2.5.8"
base64 = "0.23.1"
rand = "0.10.2"
