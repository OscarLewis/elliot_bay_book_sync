[package]
name = "ebbooks"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "A rust implementation of a certain ereader sync protocall"


[dependencies]
axum = "0.8.9"
axum-htmx = "0.8.1"
axum-test = "21.1.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["serde", "v3", "v4", "v7"] }
serde_json = "1.0.151"
test-log = "0.2.21"
reqwest = { version = "0.13.5", features = ["json"] }
bytes = "1.12.1"
tower-http = { version = "0.7.1", features = ["limit", "fs", "trace"] }
askama = { version = "0.16.1", features = ["serde_json"] }
log = "0.4.34"
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.20"
dotenvy = "0.15.7"
graphql_client = { version = "0.16.0", features = ["reqwest"] }
strsim = "0.11.1"
epub = "2.1.5"
image = "0.25.10"
tempfile = "3.27.0"
url = "2.5.8"
base64 = "0.23.1"
rand = "0.10.2"
tokio-util = { version = "0.7.19", features = ["io"] }
tower = { version = "0.5.3", features = ["tokio", "tracing"] }
config = { version = "0.15.25", features = ["toml"] }
directories = "6.0.0"
mongodb = "3.9.1"
bson = { version = "3.1.0", features = ["chrono-0_4", "serde"] }
futures-util = "0.3.34"
test-context = "0.5.8"
zip = "8.6.0"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/ebbooks", dest = "/usr/bin/ebbooks", mode = "755", is_built = true },
    { source = "ebbooks.service", dest = "/usr/lib/systemd/system/ebbooks.service", mode = "644" },
]
