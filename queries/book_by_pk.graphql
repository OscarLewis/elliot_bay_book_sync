query BookByPK($id: Int!) {
  books_by_pk(id: $id) {
    id
    slug
    title
    subtitle
    updated_at
    contributions {
      author {
        id
        name
      }
    }
    description
    image_id
    image {
      url
      width
      height
      id
    }
    images {
      id
      url
      ratio
      width
      height
    }
    pages
    parent_book_id
    release_date
    rating
    ratings_count
  }
}
